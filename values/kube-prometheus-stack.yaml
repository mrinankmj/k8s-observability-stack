grafana:
  adminPassword: admin          # local lab only
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
  additionalDataSources:
    - name: Loki
      type: loki
      url: http://loki:3100
prometheus:
  prometheusSpec:
    retention: 2d
    serviceMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
alertmanager:
  alertmanagerSpec:
    # Secret is created by `make install` (placeholder) / `make alerts-secret`
    # (real URL) — never stored in git. Alertmanager hot-reloads it on change.
    secrets:
      - alertmanager-slack-webhook
  config:
    global:
      slack_api_url_file: /etc/alertmanager/secrets/alertmanager-slack-webhook/url
    route:
      receiver: "null"
      group_by: [alertname]
      routes:
        - receiver: slack
          matchers: ["severity=critical"]
    receivers:
      - name: "null"
      - name: slack
        slack_configs:
          - channel: "#alerts"
            send_resolved: true
            title: "{{ .CommonAnnotations.summary }}"
            text: "{{ .CommonAnnotations.runbook }}"
