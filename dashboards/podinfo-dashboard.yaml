apiVersion: v1
kind: ConfigMap
metadata:
  name: podinfo-dashboard
  namespace: monitoring
  labels: { grafana_dashboard: "1" }
data:
  podinfo.json: |
    {
      "title": "Podinfo - Golden Signals",
      "schemaVersion": 39,
      "panels": [
        { "type": "stat", "title": "Availability (5m)", "gridPos": {"x":0,"y":0,"w":6,"h":4},
          "fieldConfig": { "defaults": { "unit": "percentunit", "decimals": 3,
            "thresholds": { "mode": "absolute", "steps": [
              { "value": null, "color": "red" },
              { "value": 0.99, "color": "yellow" },
              { "value": 0.999, "color": "green" }
            ] } } },
          "targets": [{ "expr": "podinfo:availability:rate5m" }] },
        { "type": "timeseries", "title": "Requests / sec", "gridPos": {"x":6,"y":0,"w":6,"h":8},
          "targets": [{ "expr": "sum(rate(http_request_duration_seconds_count{namespace=\"demo\"}[1m]))" }] },
        { "type": "timeseries", "title": "Error ratio", "gridPos": {"x":12,"y":0,"w":12,"h":8},
          "targets": [{ "expr": "podinfo:error_ratio:rate5m" }] },
        { "type": "timeseries", "title": "p95 latency (s)", "gridPos": {"x":0,"y":8,"w":12,"h":8},
          "targets": [{ "expr": "histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{namespace=\"demo\"}[5m])))" }] },
        { "type": "timeseries", "title": "CPU by pod", "gridPos": {"x":12,"y":8,"w":12,"h":8},
          "targets": [{ "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"demo\"}[1m]))" }] },
        { "type": "timeseries", "title": "Pod restarts (15m increase)", "gridPos": {"x":0,"y":16,"w":12,"h":8},
          "targets": [{ "expr": "increase(kube_pod_container_status_restarts_total{namespace=\"demo\"}[15m])" }] }
      ]
    }
